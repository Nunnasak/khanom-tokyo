<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ขนมโตเกียว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5e8d3; --ink:#4a2e1a; --muted:#8c6b50; --panel:#fffaf2; --line:#ecd9bd;
  --chip:#f1dfc3; --accent:#e0682f; --accent-2:#f29a52; --accent-ink:#fff; --shadow:rgba(90,50,20,.18);
  --overlay:rgba(48,28,14,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1e1611; --ink:#f4e7d6; --muted:#c2a68c; --panel:#2a2019; --line:#3f3127;
    --chip:#3a2c22; --accent:#f07a3f; --accent-2:#f5a463; --shadow:rgba(0,0,0,.4); --overlay:rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1e1611; --ink:#f4e7d6; --muted:#c2a68c; --panel:#2a2019; --line:#3f3127;
  --chip:#3a2c22; --accent:#f07a3f; --accent-2:#f5a463; --shadow:rgba(0,0,0,.4); --overlay:rgba(0,0,0,.6);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Mitr',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:400}
body{overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-weight:600;font-size:20px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:26px;height:12px;border-radius:7px;background:linear-gradient(90deg,#d98a2c,#f7c64e 45%,#d98a2c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
#steps{display:flex;gap:6px;flex:1;justify-content:center;min-width:0;overflow:hidden}
.pill{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap;transition:.2s}
.pill b{font-weight:600}
.pill.on{background:var(--accent);color:var(--accent-ink)}
.pill.done{color:var(--ink)}
.hbtn{padding:7px 12px;border-radius:12px;background:var(--chip);font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn:hover{filter:brightness(.97)}
.hbtn svg{width:18px;height:18px}
main{flex:1;display:flex;min-height:0;gap:16px;padding:0 16px 16px}
#stage{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#c{display:block;touch-action:none;border-radius:22px;box-shadow:0 10px 30px var(--shadow)}
aside{width:320px;flex:none;background:var(--panel);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;overflow:auto;box-shadow:0 6px 20px var(--shadow)}
.stepno{font-size:13px;color:var(--muted)}
aside h2{margin:2px 0 4px;font-size:24px;font-weight:600}
aside p{margin:0;font-size:14.5px;line-height:1.55;color:var(--muted);font-weight:300}
.lbl{font-size:13px;color:var(--muted);margin-bottom:6px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 0;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px var(--shadow)}
.seg button.on[data-h="3"]{color:#d24a1e}
.meter .mrow{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;color:var(--muted)}
.meter .mrow b{color:var(--ink);font-weight:500}
.bar{position:relative;height:12px;border-radius:7px;background:var(--chip);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:7px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .12s}
.bar .zone{position:absolute;top:0;bottom:0;background:rgba(106,168,79,.35);border-left:2px solid rgba(80,140,60,.7);border-right:2px solid rgba(80,140,60,.7)}
.bar.cook{background:linear-gradient(90deg,#faf0cd 0%,#fae496 17%,#f7c85a 33%,#eca034 50%,#be6920 67%,#64371a 83%,#24170e 100%);overflow:visible}
.bar.cook em{position:absolute;top:-4px;width:6px;height:20px;margin-left:-3px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 2px var(--panel);transition:left .15s;left:0}
.fgroup{display:flex;flex-direction:column;gap:6px}
.fgroup .glbl{font-size:13px;color:var(--muted)}
.fills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fillbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 7px;border-radius:14px;background:var(--chip);font-size:12.5px;line-height:1.2;border:2px solid transparent;text-align:center}
.fillbtn canvas{width:44px;height:44px}
.fillbtn.on{border-color:var(--accent);background:var(--panel)}
#toolArea{display:flex;flex-direction:column;gap:10px}
#toolArea:empty{display:none}
.row{display:flex;gap:8px}
.ghost{flex:1;padding:8px;border-radius:12px;background:var(--chip);font-size:14px}
.spacer{flex:1}
.primary{padding:13px 16px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:500;box-shadow:0 4px 0 rgba(150,60,20,.35);transition:transform .08s}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(150,60,20,.35)}
.primary:disabled{opacity:.45;cursor:default}
.secondary{padding:12px 16px;border-radius:16px;background:var(--chip);font-size:16px}
.hidden{display:none!important}
#toast{position:absolute;left:50%;top:18px;transform:translate(-50%,-10px);background:rgba(40,24,12,.86);color:#fff;padding:9px 16px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;padding:16px;z-index:10;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.card{background:var(--panel);border-radius:26px;padding:26px;max-width:min(920px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.hero{text-align:center;max-width:480px}
.hero h1{margin:0;font-size:46px;font-weight:600;letter-spacing:.5px}
.hero .sub{margin:4px 0 18px;color:var(--muted);font-weight:300}
.flow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0 0 22px;padding:0;list-style:none}
.flow li{background:var(--chip);padding:5px 11px;border-radius:999px;font-size:14px}
.hero .btns{display:flex;flex-direction:column;gap:10px}
.hero .stat{margin-top:14px;font-size:13.5px;color:var(--muted)}
.result{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
.result img{width:100%;border-radius:18px;display:block;box-shadow:0 6px 18px var(--shadow)}
.stars{color:#f2a51c;font-size:22px;letter-spacing:2px}
.total{font-size:15px;color:var(--muted)}
.total b{font-size:48px;color:var(--ink);font-weight:600;line-height:1}
.ttl{font-size:13px;color:var(--muted);margin-top:10px}
.result h2{margin:0;font-size:30px;font-weight:600;color:var(--accent)}
.result .desc{margin:2px 0 14px;color:var(--muted);font-weight:300}
.sbar{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;font-size:14px;margin:7px 0}
.sbar .bar{height:10px}
.sbar span:last-child{text-align:right;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 18px}
.badge{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:13px}
.badge.new{background:var(--accent);color:var(--accent-ink)}
.result .btns{display:flex;gap:10px;flex-wrap:wrap}
.result .btns button{flex:1;min-width:140px}
.gal{width:min(920px,100%)}
.galhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.galhead h2{margin:0;font-size:24px;font-weight:600}
.x{width:38px;height:38px;border-radius:12px;background:var(--chip);font-size:18px}
.galsub{color:var(--muted);font-size:14px;margin:6px 0 10px}
.titles{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.titles .badge.lock{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.gcard{background:var(--chip);border-radius:16px;overflow:hidden}
.gcard img{width:100%;display:block;aspect-ratio:1}
.gcard div{padding:8px 10px;font-size:13.5px}
.gcard b{display:block;font-weight:500;color:var(--ink)}
.gcard small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
@media (max-width:820px),(max-aspect-ratio:1/1){
  main{flex-direction:column;gap:10px;padding:0 12px 12px}
  aside{width:auto;max-height:44%;padding:14px;gap:10px;border-radius:18px}
  aside h2{font-size:19px;display:inline}
  .stepno{display:none}
  aside p{font-size:13.5px}
  .fills{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:76px;overflow-x:auto;padding-bottom:4px}
  .pill span{display:none}
  .pill{padding:5px 10px}
  .brand{font-size:17px}
  .hbtn .t{display:none}
  .result{grid-template-columns:1fr}
  .result img{max-width:320px;margin:0 auto}
  .primary{padding:11px 14px;font-size:16px}
  header{padding:8px 12px;gap:8px}
  #nextBtn{position:sticky;bottom:0;z-index:2;flex:none}
  .spacer{display:none}
}
@media (max-width:520px){ .brand{display:none} #steps{justify-content:flex-start;gap:4px} .pill{padding:4px 8px} .hbtn{padding:7px 9px} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><i></i><span>ขนมโตเกียว</span></div>
    <div id="steps"></div>
    <button class="hbtn" id="muteBtn" title="เสียง"></button>
    <button class="hbtn" id="galBtn" title="แกลเลอรี"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><span class="t">แกลเลอรี</span></button>
    <button class="hbtn" id="restartBtn" title="เริ่มใหม่"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span class="t">เริ่มใหม่</span></button>
  </header>
  <main>
    <div id="stage"><canvas id="c"></canvas><div id="toast"></div></div>
    <aside id="panel">
      <div>
        <div class="stepno" id="stepNo"></div>
        <h2 id="stepName"></h2>
        <p id="stepHint"></p>
      </div>
      <div id="toolArea"></div>
      <div id="heatBox">
        <div class="lbl">ระดับไฟ</div>
        <div class="seg" id="heatSeg">
          <button data-h="0">ปิด</button><button data-h="1">อ่อน</button><button data-h="2">กลาง</button><button data-h="3">แรง</button>
        </div>
      </div>
      <div class="meter" id="mButter"><div class="mrow"><span>เนยทั่วกระทะ</span><b id="vButter">0%</b></div><div class="bar"><i id="fButter"></i></div></div>
      <div class="meter" id="mBatter"><div class="mrow"><span>ปริมาณแป้ง</span><b id="vBatter">0 ml</b></div><div class="bar"><span class="zone" id="zBatter"></span><i id="fBatter"></i></div></div>
      <div class="meter" id="mCook"><div class="mrow"><span>ความสุก</span><b id="vCook">–</b></div><div class="bar cook"><em id="kCook"></em></div></div>
      <div class="meter" id="mRoll"><div class="mrow"><span>ม้วนแล้ว</span><b id="vRoll">0%</b></div><div class="bar"><i id="fRoll"></i></div></div>
      <div class="spacer"></div>
      <button class="primary" id="nextBtn">ต่อไป</button>
    </aside>
  </main>
</div>

<div class="overlay show" id="titleScreen">
  <div class="card hero">
    <h1>ขนมโตเกียว</h1>
    <p class="sub">ร้านรถเข็นหน้าโรงเรียน · ทำเองทุกขั้นตอน</p>
    <ol class="flow"><li>เช็ดเนย</li><li>โรยลาย</li><li>หยอดแป้ง</li><li>ละเลง</li><li>ใส่ไส้</li><li>ม้วน</li><li>เสิร์ฟ</li></ol>
    <div class="btns">
      <button class="primary" id="startBtn">เริ่มทำขนม</button>
      <button class="secondary" id="titleGal">แกลเลอรี &amp; ฉายา</button>
    </div>
    <div class="stat" id="titleStat"></div>
  </div>
</div>

<div class="overlay" id="resultOv">
  <div class="card result">
    <img id="resImg" alt="ขนมโตเกียวที่ทำเสร็จ">
    <div>
      <div class="stars" id="resStars"></div>
      <div class="total"><b id="resTotal">0</b> / 100 คะแนน</div>
      <div class="ttl">ได้ฉายาว่า</div>
      <h2 id="resTitle"></h2>
      <p class="desc" id="resDesc"></p>
      <div id="resBars"></div>
      <div class="badges" id="resBadges"></div>
      <div class="btns">
        <button class="primary" id="againBtn">ทำอีกแผ่น</button>
        <button class="secondary" id="resGal">ดูแกลเลอรี</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="galOv">
  <div class="card gal">
    <div class="galhead"><h2>แกลเลอรีขนมโตเกียว</h2><button class="x" id="galClose" aria-label="ปิด">✕</button></div>
    <div class="galsub" id="galSub"></div>
    <div class="titles" id="galTitles"></div>
    <div class="grid" id="galGrid"></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function circle(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU)}
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const mem={};
const store={get(k,d){if(k in mem)return mem[k];try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));delete mem[k];return true}catch(e){mem[k]=v;return false}}};

/* steps */
const BUT=0, LACE=1, POUR=2, SPREAD=3, FILL=4, ROLL=5, SERVE=6;

/* ---------------- simulation grid ---------------- */
const N=220, CELL=4, G0=60, GC=500, GR=440, GRC=GR/CELL, NN=N*N;
const batter=new Float32Array(NN), cook=new Float32Array(NN), butter=new Float32Array(NN);
const pat=new Float32Array(NN), patCk=new Float32Array(NN);
const eggW=new Float32Array(NN), eggY=new Float32Array(NN), eggCk=new Float32Array(NN), eggTmp=new Float32Array(NN);
const tmp=new Float32Array(NN), fillAmt=new Float32Array(NN);
const heatMap=new Float32Array(NN), inG=new Uint8Array(NN), pore=new Float32Array(NN);
function valueNoise(scale,seed){
  const r=rng(seed), gw=Math.ceil(N/scale)+2, g=new Float32Array(gw*gw);
  for(let i=0;i<g.length;i++) g[i]=r();
  const out=new Float32Array(NN);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const fx=x/scale, fy=y/scale, ix=fx|0, iy=fy|0;
    let tx=fx-ix, ty=fy-iy; tx=tx*tx*(3-2*tx); ty=ty*ty*(3-2*ty);
    const a=g[iy*gw+ix], b=g[iy*gw+ix+1], c=g[(iy+1)*gw+ix], d=g[(iy+1)*gw+ix+1];
    out[y*N+x]=(a+(b-a)*tx)*(1-ty)+(c+(d-c)*tx)*ty;
  }
  return out;
}
const lace=new Float32Array(NN), spot=new Float32Array(NN);
{
  const a=valueNoise(6,1), b=valueNoise(2.5,2), c=valueNoise(10,3), d=valueNoise(3,4), r=rng(5);
  for(let i=0;i<NN;i++){ lace[i]=a[i]*0.6+b[i]*0.4; spot[i]=c[i]*0.65+d[i]*0.35; pore[i]=r(); }
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=y*N+x, dx=x+0.5-N/2, dy=y+0.5-N/2, d2=Math.hypot(dx,dy);
    inG[i]=d2<GRC-3?1:0; heatMap[i]=1.12-0.3*Math.pow(d2/GRC,2);
  }
}
const innerIdx=[]; for(let y=0;y<N;y++)for(let x=0;x<N;x++){ if(Math.hypot(x+0.5-N/2,y+0.5-N/2)<GRC*0.78) innerIdx.push(y*N+x); }

// egg-yellow Thai batter: raw cream -> set yellow -> golden -> orange-brown -> burnt
const CST=[[0,250,240,206],[0.5,251,229,150],[1.0,248,203,92],[1.5,238,162,52],[2.0,192,106,30],[2.5,102,56,20],[3.0,36,24,14]];
const LUT=new Uint8Array(301*3);
for(let k=0;k<=300;k++){const c=k/100;let j=0;while(j<CST.length-2&&c>CST[j+1][0])j++;const a=CST[j],b=CST[j+1],t=clamp((c-a[0])/(b[0]-a[0]),0,1);for(let q=0;q<3;q++)LUT[k*3+q]=a[q+1]+(b[q+1]-a[q+1])*t;}
function cookRGB(c){const k=(clamp(c,0,3)*100|0)*3;return[LUT[k],LUT[k+1],LUT[k+2]]}
function rgbs(a,m,add){m=m==null?1:m;add=add||0;return`rgb(${clamp(a[0]*m+add,0,255)|0},${clamp(a[1]*m+add,0,255)|0},${clamp(a[2]*m+add,0,255)|0})`}

/* ---------------- canvases ---------------- */
const cv=$('#c'), ctx=cv.getContext('2d');
let SC=1, bgC=mk(10,10), serveBg=mk(10,10);
const baC=mk(N,N), bactx=baC.getContext('2d'), baImg=bactx.createImageData(N,N);
const buC=mk(N,N), buctx=buC.getContext('2d'), buImg=buctx.createImageData(N,N);
const paC=mk(N,N), pactx=paC.getContext('2d'), paImg=pactx.createImageData(N,N);
const egC=mk(N,N), egctx=egC.getContext('2d'), egImg=egctx.createImageData(N,N);
const FLS=1.4, fillLayer=mk(1400,1400), flctx=fillLayer.getContext('2d');
flctx.setTransform(FLS,0,0,FLS,0,0);
const shadeStrip=mk(64,1);
{const c=shadeStrip.getContext('2d'),g=c.createLinearGradient(0,0,64,0);
 g.addColorStop(0,'rgba(60,25,0,.5)');g.addColorStop(.14,'rgba(60,25,0,.12)');g.addColorStop(.3,'rgba(255,248,220,.38)');g.addColorStop(.42,'rgba(255,248,220,.06)');g.addColorStop(.75,'rgba(60,25,0,.12)');g.addColorStop(1,'rgba(60,25,0,.48)');
 c.fillStyle=g;c.fillRect(0,0,64,1);}
const steamSprite=mk(64,64);
{const c=steamSprite.getContext('2d'),g=c.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,64,64);}

/* ---------------- fillings ---------------- */
const FILLS=[
  {id:'custard',name:'ครีมคัสตาร์ด',kind:'cream',color:'#F6C431',hi:'#FFF1A8',w:20,sweet:1},
  {id:'pandan',name:'สังขยาใบเตย',kind:'cream',color:'#7DB544',hi:'#D9F2AE',w:20,sweet:1},
  {id:'taro',name:'ครีมเผือก',kind:'cream',color:'#A983CB',hi:'#EADCF4',w:20,sweet:1},
  {id:'choco',name:'ช็อกโกแลต',kind:'cream',color:'#5B3421',hi:'#B07E60',w:14,sweet:1},

function creamPath(c,pts,ox,oy){
  c.beginPath(); c.moveTo(pts[0]+ox,pts[1]+oy);
  if(pts.length<=2){c.lineTo(pts[0]+ox+0.1,pts[1]+oy);return}
  for(let k=2;k<pts.length-2;k+=2){const mx=(pts[k]+pts[k+2])/2,my=(pts[k+1]+pts[k+3])/2;c.quadraticCurveTo(pts[k]+ox,pts[k+1]+oy,mx+ox,my+oy)}
  c.lineTo(pts[pts.length-2]+ox,pts[pts.length-1]+oy);
}
function drawCream(c,type,pts){
  const f=FD[type], w=f.w;
  c.save(); c.lineCap='round'; c.lineJoin='round';
  creamPath(c,pts,2,3.5); c.strokeStyle='rgba(70,35,5,.22)'; c.lineWidth=w+2; c.stroke();
  creamPath(c,pts,0,0); c.strokeStyle=f.color; c.lineWidth=w; c.stroke();
  creamPath(c,pts,w*0.1,w*0.12); c.strokeStyle='rgba(0,0,0,.08)'; c.lineWidth=w*0.5; c.stroke();
  creamPath(c,pts,-w*0.17,-w*0.2); c.strokeStyle=f.hi; c.globalAlpha=.6; c.lineWidth=w*0.3; c.stroke();
  c.restore();
}
const PAL={foithong:['#F7B81E','#F2A413','#FFCB3D','#E89A0C','#FFD45A'],floss:['#C9823F','#B56E31','#D99A57','#A85F28','#E0AE6C'],pork:['#B88A5C','#A0703F','#C9A06E','#8C5E35','#D2AE80']};

  const X=x+Math.cos(a)*d, Y=y+Math.sin(a)*d;
  if(type==='pork') return {crumb:1,x:X,y:Y,r:3.4+Math.random()*3.6,col,seed:(Math.random()*1e9)|0};

}
function fiberPath(c,f,ox,oy){
  let x=f.x,y=f.y,a=f.a; const st=f.len/5; c.beginPath(); c.moveTo(x+ox,y+oy);
  for(let k=0;k<5;k++){a+=f.curl;x+=Math.cos(a)*st;y+=Math.sin(a)*st;c.lineTo(x+ox,y+oy)}
}
function crumbPath(c,f,ox,oy){
  const r=rng(f.seed); c.beginPath();
  for(let k=0;k<6;k++){const a=k/6*TAU,d=f.r*(0.7+r()*0.5);const x=f.x+Math.cos(a)*d+ox,y=f.y+Math.sin(a)*d+oy;k?c.lineTo(x,y):c.moveTo(x,y)}

}

let AC=null, sizzleG=null, master=null;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=S.muted?0:1; master.connect(AC.destination);
    const len=AC.sampleRate*2, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(Math.random()<0.015?1:0.3);
    const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=4200; bp.Q.value=0.6;
    const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1200;
    sizzleG=AC.createGain(); sizzleG.gain.value=0;
    src.connect(bp); bp.connect(hp); hp.connect(sizzleG); sizzleG.connect(master); src.start();
  }catch(e){AC=null}
}
function setSizzle(v){ if(AC&&sizzleG) sizzleG.gain.setTargetAtTime(v,AC.currentTime,0.12); }
function blip(freq,dur,vol,type){

  try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,AC.currentTime);o.frequency.exponentialRampToValueAtTime(freq*0.6,AC.currentTime+dur);
  g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+dur+0.02);}catch(e){}
}

/* ---------------- batter physics ---------------- */
function addBatter(i,m){const t=batter[i];cook[i]=t>0?cook[i]*t/(t+m):0;batter[i]=t+m}
function toCell(x,y){return{x:(x-G0)/CELL,y:(y-G0)/CELL}}
function onGriddle(x,y){return Math.hypot(x-GC,y-GC)<GR-12}
function pour(dt){
  if(!onGriddle(P.x,P.y)) return;
  if(S.poured>=8600){ if(!S.toldFull){toast('แป้งหมดกระบวยแล้ว');S.toldFull=true} return; }
  const c=toCell(P.x,P.y), amt=2300*dt, sg=3.2, R=8; let ws=0;
  const xa=Math.max(1,Math.floor(c.x-R)),xb=Math.min(N-2,Math.ceil(c.x+R)),ya=Math.max(1,Math.floor(c.y-R)),yb=Math.min(N-2,Math.ceil(c.y+R));
  for(let pass=0;pass<2;pass++){
    for(let y=ya;y<=yb;y++)for(let x=xa;x<=xb;x++){const i=y*N+x;if(!inG[i])continue;const dx=x+0.5-c.x,dy=y+0.5-c.y,w=Math.exp(-(dx*dx+dy*dy)/(2*sg*sg));
      if(pass===0)ws+=w;else addBatter(i,amt*w/ws)}
    if(ws<=0) return;
  }
  S.poured+=amt; S.hasBatter=true;
}
const NB=[1,-1,N,-N,N+1,N-1,-N+1,-N-1], NBW=[1,1,1,1,0.7071,0.7071,0.7071,0.7071];
function flow(){
  tmp.fill(0);
  for(let y=1;y<N-1;y++){for(let x=1;x<N-1;x++){
    const i=y*N+x,t=batter[i]; if(t<0.5) continue; const ck=cook[i]; if(ck>0.45) continue;
    const mob=0.075*(1-ck/0.45);
    for(let k=0;k<8;k++){
      const j=i+NB[k]; if(!inG[j]) continue;
      const d=(t-batter[j])*NBW[k]-0.012; if(d>0){const m=d*mob*NBW[k];tmp[i]-=m;tmp[j]+=m}
    }
  }}
  for(let i=0;i<NN;i++){const m=tmp[i];if(m>0)addBatter(i,m);else if(m<0)batter[i]+=m}
}
const LR=15, FILM=0.2, dIdx=new Int32Array(600), dW=new Float32Array(600);
function spreadAt(px,py,ux,uy){
  const r2=LR*LR, ro=(LR+3)*(LR+3);
  const xa=Math.max(1,Math.floor(px-LR-4)),xb=Math.min(N-2,Math.ceil(px+LR+4)),ya=Math.max(1,Math.floor(py-LR-4)),yb=Math.min(N-2,Math.ceil(py+LR+4));
  let cnt=0,ws=0;
  for(let y=ya;y<=yb;y++)for(let x=xa;x<=xb;x++){
    const i=y*N+x; if(!inG[i]) continue;
    const ex=x+0.5-px, ey=y+0.5-py, d2=ex*ex+ey*ey;
    if(d2<=r2){
      const t=batter[i];
      if(t>FILM){const mob=1-Math.min(1,cook[i]);if(mob>0){const take=(t-FILM)*0.5*mob;batter[i]=t-take;S.carry+=take}}
    }else if(d2<=ro&&cnt<600){
      const d=Math.sqrt(d2), dot=(ex*ux+ey*uy)/d;
      if(dot>0.25){dIdx[cnt]=i;dW[cnt]=dot-0.25;ws+=dot-0.25;cnt++}
    }
  }
  if(cnt>0&&S.carry>0.001){const amt=S.carry*0.3;for(let k=0;k<cnt;k++)addBatter(dIdx[k],amt*dW[k]/ws);S.carry-=amt}
}
function spreadSeg(x0,y0,x1,y1){
  const a=toCell(x0,y0), b=toCell(x1,y1), dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy);
  if(L<0.05) return;
  const ux=dx/L, uy=dy/L, n=Math.ceil(L);
  for(let k=1;k<=n;k++) spreadAt(a.x+dx*k/n,a.y+dy*k/n,ux,uy);
}
function dropCarry(x,y){
  if(S.carry<0.01){S.carry=0;return}
  const c=toCell(x,y); let cnt=0;
  const xa=Math.max(1,Math.floor(c.x-LR-4)),xb=Math.min(N-2,Math.ceil(c.x+LR+4)),ya=Math.max(1,Math.floor(c.y-LR-4)),yb=Math.min(N-2,Math.ceil(c.y+LR+4));
  for(let pass=0;pass<2;pass++){
    for(let y2=ya;y2<=yb;y2++)for(let x2=xa;x2<=xb;x2++){const i=y2*N+x2;if(!inG[i])continue;const d=Math.hypot(x2+0.5-c.x,y2+0.5-c.y);
      if(d>=LR-1&&d<=LR+3){if(pass===0)cnt++;else addBatter(i,S.carry/cnt)}}
    if(cnt===0) break;
  }
  if(cnt>0) S.carry=0;
}
function rubSeg(x0,y0,x1,y1){
  const a=toCell(x0,y0), b=toCell(x1,y1), L=Math.hypot(b.x-a.x,b.y-a.y), n=Math.max(1,Math.ceil(L/2)), R=14;
  for(let k=0;k<=n;k++){
    const px=a.x+(b.x-a.x)*k/n, py=a.y+(b.y-a.y)*k/n;
    for(let y=Math.max(0,Math.floor(py-R));y<=Math.min(N-1,Math.ceil(py+R));y++)
      for(let x=Math.max(0,Math.floor(px-R));x<=Math.min(N-1,Math.ceil(px+R));x++){
        const i=y*N+x; if(!inG[i]) continue; const d=Math.hypot(x+0.5-px,y+0.5-py); if(d>R) continue;
        butter[i]=Math.min(1.2,butter[i]+0.14*(1-d/R));
      }
  }
  S.buDirty=true;
}
function laceSeg(x0,y0,x1,y1){
  const a=toCell(x0,y0), b=toCell(x1,y1), L=Math.hypot(b.x-a.x,b.y-a.y), n=Math.max(1,Math.ceil(L/0.7)), R=2.1;
  for(let k=0;k<=n;k++){
    const px=a.x+(b.x-a.x)*k/n, py=a.y+(b.y-a.y)*k/n;
    for(let y=Math.max(0,Math.floor(py-R));y<=Math.min(N-1,Math.ceil(py+R));y++)
      for(let x=Math.max(0,Math.floor(px-R));x<=Math.min(N-1,Math.ceil(px+R));x++){
        const i=y*N+x; if(!inG[i]) continue; const d=Math.hypot(x+0.5-px,y+0.5-py); if(d>R) continue;
        const v=0.5*(1-d/R*0.85); if(v>pat[i]){ if(pat[i]<0.02) patCk[i]=0; pat[i]=v; }
      }
  }
  S.hasPat=true; S.paDirty=true;
}
function crackEgg(x,y){
  const c=toCell(x,y), R=28;
  for(let yy=Math.max(1,Math.floor(c.y-R));yy<=Math.min(N-2,Math.ceil(c.y+R));yy++)

function rollGestureEnd(){
  const R=S.roll; if(!R||!R.g0) return; const g0=R.g0, g1=R.gc; R.g0=null;
  const dx=g1.x-g0.x, dy=g1.y-g0.y, L=Math.hypot(dx,dy), dt=Math.max(0.03,(performance.now()-g0.t)/1000), sp=L/dt;
  if(R.phase==='aim'){
    if(L<50){toast('ปัดนิ้วยาวขึ้นอีกนิด จากขอบแผ่นเข้าหาไส้');return}
    orientRoll(Math.atan2(dy,dx));

  }

  const ca=Math.cos(R.alpha), sa=Math.sin(R.alpha), along=dx*ca+dy*sa, side=-dx*sa+dy*ca;

}

/* ---------------- frame ---------------- */
const steam=[];
function updSteam(dt){
  const H=HEATS[S.heat];
  if(S.step>=POUR&&S.step<=FILL&&S.hasBatter&&H>0){
    S.steamAcc+=dt*Math.min(24,S.rawMass*0.01*H+2*H);
    while(S.steamAcc>1&&steam.length<90){S.steamAcc--;for(let tr=0;tr<8;tr++){const i=(Math.random()*NN)|0;if(batter[i]>0.05){
      steam.push({x:G0+(i%N)*CELL,y:G0+((i/N)|0)*CELL,vx:(Math.random()-0.5)*16,vy:-30-Math.random()*40,life:0,max:1.5+Math.random()*1.3,s:26+Math.random()*30});break}}}
  }
  for(let i=steam.length-1;i>=0;i--){const p=steam[i];p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.s+=dt*30;if(p.life>p.max)steam.splice(i,1)}
}
let lastT=performance.now(), clock=0;
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now; clock+=dt;
  update(dt); draw();
  requestAnimationFrame(frame);
}
function update(dt){
  const st=S.step, H=HEATS[S.heat];
  if(st>=LACE&&st<=FILL){
    if(S.hasPat) patUpdate(dt,H);
    if(S.pouring&&st===POUR&&P.down) pour(dt);
    if(S.hasBatter){ const it=st===POUR?3:1; for(let k=0;k<it;k++) flow(); cookUpdate(dt,H); renderBatter(); }
    if(S.hasHen){ eggFlow(); eggCook(dt,H); S.egDirty=true; }
    for(const a of S.actions) if(a.type==='egg') for(const p of a.items) p.cook+=dt*H*0.07;
    if(S.cur&&S.cur.type==='egg') for(const p of S.cur.items) p.cook+=dt*H*0.07;
  }
  if(S.buDirty) renderButter();
  if(S.paDirty) renderPattern();
  if(S.egDirty) renderEgg();
  for(let i=S.cracks.length-1;i>=0;i--){S.cracks[i].t+=dt;if(S.cracks[i].t>0.6)S.cracks.splice(i,1)}
  updSteam(dt);
  let sz=0;
  if(st===BUT&&S.rubbing) sz=0.05*H;
  else if(st===LACE&&P.down) sz=0.08*H;
  else if(st>=POUR&&st<=FILL&&S.hasBatter) sz=Math.min(0.32,0.04+S.rawMass/3200*0.28)*Math.min(1.3,H);
  setSizzle(S.muted?0:sz);
  if(st===ROLL) rollAnim(dt);
  if(st===SERVE){S.serveT+=dt;if(S.serveT>1.9&&!S.resultShown)showResult()}
  S.meterT-=dt; if(S.meterT<=0){S.meterT=0.1;updateMeters()}
}
function draw(){
  const c=ctx;
  c.setTransform(1,0,0,1,0,0);
  if(S.step===SERVE){c.drawImage(serveBg,0,0);c.setTransform(SC,0,0,SC,0,0);drawServeContent(c,S.serveT);return}
  c.drawImage(bgC,0,0); c.setTransform(SC,0,0,SC,0,0);
  const H=HEATS[S.heat];
  if(H>0&&S.step<ROLL){
    const fl=0.85+0.15*Math.sin(clock*7)*Math.sin(clock*3.1);
    const g=c.createRadialGradient(GC,GC,470,GC,GC,530); g.addColorStop(0,`rgba(255,120,30,${0.32*H*fl})`); g.addColorStop(1,'rgba(255,90,20,0)');
    c.fillStyle=g; c.beginPath(); c.arc(GC,GC,530,0,TAU); c.arc(GC,GC,476,0,TAU,true); c.fill('evenodd');
  }
  c.imageSmoothingEnabled=true; c.imageSmoothingQuality='high';
  c.globalCompositeOperation='screen'; c.drawImage(buC,G0,G0,N*CELL,N*CELL); c.globalCompositeOperation='source-over';
  if(S.step===ROLL&&S.roll){
    const R=S.roll;
    c.drawImage(R.spill,0,0,1000,1000);
    if(R.alpha==null) c.drawImage(R.flat,0,0,1000,1000);
    else{
      const cut=R.phase==='folding'?R.foldX:R.X;
      c.save(); c.translate(GC,GC); c.rotate(R.alpha); c.translate(-GC,-GC);
      c.save(); c.beginPath(); c.rect(cut,-1000,3000,3000); c.clip(); worldDraw(c,R.flat,0,0,1000,1000); c.restore();
      if(R.phase==='folding') drawFlap(c); else drawTubeTop(c);
      c.restore();
    }
  }else{
    if(S.hasPat) c.drawImage(paC,G0,G0,N*CELL,N*CELL);
    if(S.hasBatter) c.drawImage(baC,G0,G0,N*CELL,N*CELL);
    if(S.hasPat&&S.hasBatter){c.globalAlpha=.3;c.drawImage(paC,G0,G0,N*CELL,N*CELL);c.globalAlpha=1}
    if(S.hasHen) c.drawImage(egC,G0,G0,N*CELL,N*CELL);
    c.drawImage(fillLayer,0,0,1000,1000);
    drawEggs(c);
    drawShells(c);
    if(S.cur&&S.cur.kind==='cream') drawCream(c,S.cur.type,S.cur.items[0].pts);
  }
  for(const p of steam){c.globalAlpha=0.17*Math.sin(Math.PI*p.life/p.max);c.drawImage(steamSprite,p.x-p.s/2,p.y-p.s/2,p.s,p.s)} c.globalAlpha=1;
  drawHints(c); drawTool(c);
}
function hintText(c,txt,x,y,size){
  c.font=`500 ${size||30}px Mitr,sans-serif`; c.textAlign='center'; c.textBaseline='middle';
  c.lineWidth=6; c.lineJoin='round'; c.strokeStyle='rgba(30,15,5,.6)'; c.strokeText(txt,x,y); c.fillStyle='#fff8ea'; c.fillText(txt,x,y);
}
function drawHints(c){
  const pulse=0.5+0.5*Math.sin(clock*4);
  if(S.step===BUT&&butterCov()<0.04&&!P.down) hintText(c,'ถูเนยให้ทั่วกระทะ',GC,GC);
  if(S.step===LACE&&!S.hasPat&&!P.down) hintText(c,'ลากเพื่อบีบเส้นแป้งเป็นลาย',GC,GC);
  if(S.step===POUR&&!(P.inside||P.down)) drawTarget(c,GC,GC,S.poured<300?'แตะค้างเพื่อเทแป้ง':null);
  if(S.step===SPREAD&&!S.spreadStarted) hintText(c,'ลากกระบวยดันแป้งให้บาง ทรงไหนก็ได้',GC,GC+250);
  if(S.step===ROLL&&S.roll&&!S.roll.done){
    const R=S.roll;
    if(R.g0){
      const dx=R.gc.x-R.g0.x, dy=R.gc.y-R.g0.y, L=Math.hypot(dx,dy);
      if(L>8){
        let col='#ff8a3d';
        if(R.phase==='roll'){const ca=Math.cos(R.alpha),sa=Math.sin(R.alpha),along=dx*ca+dy*sa,side=-dx*sa+dy*ca;col=along>0&&Math.atan2(Math.abs(side),along)<0.45?'#7bd36a':'#ff8a3d'}
        drawArrow(c,R.g0.x,R.g0.y,R.gc.x,R.gc.y,col,8);
        if(R.phase==='aim'){const deg=((Math.round(Math.atan2(-dy,dx)*180/Math.PI)%360)+360)%360;hintText(c,`ทิศม้วน ${deg}°`,clamp(R.gc.x,140,860),clamp(R.gc.y-46,40,960),26)}
      }
    } else if(!R.anim){
      if(R.phase==='aim'){
        const a=clock*0.6, cx=GC+Math.cos(a)*250, cy=GC+Math.sin(a)*250;
        drawArrow(c,cx,cy,cx+(GC-cx)*0.4,cy+(GC-cy)*0.4,'rgba(255,248,234,.9)',7);
        hintText(c,'ปัดจากขอบแผ่นเข้าหาไส้ ทิศไหนก็ได้',GC,930,26);
      } else if(R.phase==='roll'){
        const g=tubeGeo(R.X), mid=(g.rTop+g.rBot+1)/2*CELL+G0, b=pulse*24;
        const p0=rollToWorld(R.X+30+b,mid), p1=rollToWorld(R.X+170+b,mid);
        drawArrow(c,p0.x,p0.y,p1.x,p1.y,'rgba(255,248,234,.92)',9);
        const left=Math.max(1,Math.ceil((R.xmaxL-R.X)/clamp(TAU*g.rad*0.75,70,190)));
        hintText(c,`ปัดตามลูกศรเพื่อพลิกม้วน · อีกราว ${left} ครั้ง`,GC,930,26);
      }
    }
  }
}
function butterCov(){let n=0;for(const i of innerIdx) if(butter[i]>0.15) n++;return n/innerIdx.length}
function drawTool(c){
  const st=S.step;
  if(st===ROLL) return;
  if(!(P.inside||P.down)) return;
  if(st===BUT) drawButterTool(c,P.x,P.y);
  else if(st===LACE) drawBottle(c,P.x,P.y);
  else if(st===POUR){

    else if(f.kind==='hen'){
      if(eggAt(P.x,P.y)>0.15){c.strokeStyle='rgba(255,250,235,.85)';c.lineWidth=2.5;c.setLineDash([6,6]);circle(c,P.x,P.y,32);c.stroke();c.setLineDash([]);if(!P.down)hintText(c,'ลากเพื่อคนไข่',P.x,P.y-52,22)}
      else{c.save();c.fillStyle='rgba(0,0,0,.2)';c.beginPath();c.ellipse(P.x+5,P.y-24,22,28,0.3,0,TAU);c.fill();
        const g=c.createRadialGradient(P.x-8,P.y-40,3,P.x,P.y-30,30);g.addColorStop(0,'#FFF8EE');g.addColorStop(1,'#DDBB90');
        c.fillStyle=g;c.beginPath();c.ellipse(P.x,P.y-30,22,28,0.3,0,TAU);c.fill();c.restore()}
    }

  }
}

/* ---------------- input ---------------- */
function toL(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*1000,y:(e.clientY-r.top)/r.height*1000}}
cv.addEventListener('pointerdown',e=>{
  if(S.step<0||S.step>ROLL) return;
  e.preventDefault(); initAudio(); try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=toL(e); P.down=true; P.inside=true; P.x=p.x; P.y=p.y;
  switch(S.step){
    case BUT: S.rubbing=true; rubSeg(p.x,p.y,p.x,p.y); break;
    case LACE: laceSeg(p.x,p.y,p.x,p.y); break;
    case POUR: S.pouring=true; break;
    case FILL: fillDown(p); break;
    case ROLL: rollGestureStart(p); break;
  }
});
cv.addEventListener('pointermove',e=>{
  const p=toL(e), lx=P.x, ly=P.y; P.inside=true; P.x=p.x; P.y=p.y;
  if(!P.down) return;
  switch(S.step){
    case BUT: rubSeg(lx,ly,p.x,p.y); break;
    case LACE: laceSeg(lx,ly,p.x,p.y); break;
    case SPREAD: if(S.hasBatter){spreadSeg(lx,ly,p.x,p.y);S.spreadStarted=true} break;
    case FILL: fillMove(p.x,p.y); break;
    case ROLL: rollGestureMove(p); break;
  }
});
function pUp(e){
  if(!P.down) return; P.down=false;
  switch(S.step){
    case BUT: S.rubbing=false; break;
    case LACE: renderPanel(); break;
    case POUR: S.pouring=false; break;
    case SPREAD: dropCarry(P.x,P.y); break;
    case FILL: fillUp(); break;
    case ROLL: rollGestureEnd(); break;
  }
  if(e.pointerType!=='mouse') P.inside=false;
}
cv.addEventListener('pointerup',pUp); cv.addEventListener('pointercancel',pUp);
cv.addEventListener('pointerleave',()=>{if(!P.down)P.inside=false});

function fillDown(p){
  if(!onGriddle(p.x,p.y)) return;
  const f=FD[S.tool]; S.curLast={x:p.x,y:p.y};
  if(f.kind==='hen'){
    S.cur={type:'hen',kind:'hen',items:[],cracks:0,snapW:eggW.slice(),snapY:eggY.slice(),snapC:eggCk.slice()};
    if(eggAt(p.x,p.y)<0.15){crackEgg(p.x,p.y);S.cur.cracks++;S.cur.items.push(1)}
    return;
  }
  S.cur={type:f.id,kind:f.kind,items:[]};
  if(f.kind==='cream') S.cur.items.push({pts:[p.x,p.y]});
  else if(scatterKind(f.kind)) spawnScatter(p.x,p.y,5);
  else placePiece(p.x,p.y);
}
function fillMove(x,y){
  const c=S.cur; if(!c||!onGriddle(x,y)) return;
  const f=FD[c.type], d=Math.hypot(x-S.curLast.x,y-S.curLast.y);
  if(f.kind==='hen'){stirSeg(S.curLast.x,S.curLast.y,x,y);S.curLast={x,y};c.items.push(0);return}
  if(f.kind==='cream'){if(d>=3){c.items[0].pts.push(x,y);S.curLast={x,y}}}
  else if(scatterKind(f.kind)){if(d>=5){spawnScatter(x,y,Math.ceil(d/6)+1);S.curLast={x,y}}}
  else if(d>=f.gap){placePiece(x,y);S.curLast={x,y}}
}
function fillUp(){
  const c=S.cur; if(!c) return; S.cur=null;
  if(c.kind==='hen') dropEggCarry(S.curLast.x,S.curLast.y);
  if(c.kind==='cream'){drawCream(flctx,c.type,c.items[0].pts);blip(220,0.12,0.06)}
  if(c.items.length) S.actions.push(c);
}
function spawnScatter(x,y,n){for(let i=0;i<n;i++){const f=makeScatter(S.cur.type,x,y,S.cur.type==='pork'?28:26);S.cur.items.push(f);drawScatter(flctx,f)}}
function placePiece(x,y){
  const p=makePiece(S.cur.type,x,y); S.cur.items.push(p);
  if(p.type!=='egg') drawPiece(flctx,p);
  blip(p.type==='egg'?300:480+Math.random()*240,0.09,0.1);
}

function goNext(){
  const st=S.step;
  if(st===POUR&&S.poured<500) return;
  if(st===SPREAD) dropCarry(P.x,P.y);
  if(st===FILL){
    if(S.sumT<15){toast('ยังไม่มีแป้งพอจะม้วนเลย ลองเริ่มใหม่นะ');return}

  }
  if(st===ROLL){ if(!S.roll||!S.roll.done) return; S.step=SERVE; S.serveT=0; S.resultShown=false; renderPanel(); blip(520,0.15,0.1,'triangle'); return; }

}
$('#nextBtn').onclick=goNext;

function reset(){
  batter.fill(0); cook.fill(0); butter.fill(0); fillAmt.fill(0); pat.fill(0); patCk.fill(0); eggW.fill(0); eggY.fill(0); eggCk.fill(0);
  Object.assign(S,{pouring:false,rubbing:false,carry:0,poured:0,hasBatter:false,hasPat:false,actions:[],cur:null,roll:null,art:null,stats:null,serveT:0,resultShown:false,rawMass:0,sumT:0,sumTC:0,spreadStarted:false,toldFull:false,buDirty:true,paDirty:true,hasHen:false,egDirty:true,cracks:[],ecW:0,ecY:0});
  steam.length=0; redrawFillLayer(); renderBatter();
}
function startGame(){ reset(); S.step=BUT; S.heat=2; hideAll(); renderPanel(); initAudio(); }
function hideAll(){document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show'))}
$('#startBtn').onclick=startGame;
$('#restartBtn').onclick=()=>{ startGame(); toast('เริ่มแผ่นใหม่'); };
$('#againBtn').onclick=startGame;
$('#muteBtn').onclick=()=>{S.muted=!S.muted;store.set('tokyo.muted',S.muted);renderMute();initAudio()};

function stars(n){return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n)}
function starCount(t){return t>=90?5:t>=75?4:t>=60?3:t>=40?2:1}
function showResult(){
  S.resultShown=true;
  const s=S.stats; const matched=TITLES.filter(t=>{try{return t.t(s)}catch(e){return false}});
  const main=matched[0]||TITLES[TITLES.length-1];
  const unlocked=new Set(store.get('tokyo.titles',[])); const fresh=matched.filter(t=>!unlocked.has(t.id)).map(t=>t.id);
  matched.forEach(t=>unlocked.add(t.id)); store.set('tokyo.titles',[...unlocked]);
  const img=makeThumb();
  const gal=store.get('tokyo.gallery',[]);
  gal.unshift({img,total:s.total,title:main.name,date:Date.now()}); while(gal.length>40) gal.pop();
  if(!store.set('tokyo.gallery',gal)){gal.length=Math.min(gal.length,10);store.set('tokyo.gallery',gal)}
  if(s.total>store.get('tokyo.best',0)) store.set('tokyo.best',s.total);
  $('#resImg').src=img; $('#resStars').textContent=stars(starCount(s.total)); $('#resTotal').textContent=s.total;
  $('#resTitle').textContent=main.name; $('#resDesc').textContent=main.desc;
  const L=[['ขนาดแผ่น','round'],['บางสม่ำเสมอ','thin'],['ความสุก','cook'],['ไส้','fill'],['การม้วน','roll']];
  $('#resBars').innerHTML=L.map(([n,k])=>`<div class="sbar"><span>${n}</span><div class="bar"><i style="width:${s.sc[k]/20*100}%"></i></div><span>${Math.round(s.sc[k])}/20</span></div>`).join('');
  $('#resBadges').innerHTML=matched.filter(t=>t!==main).slice(0,8).map(t=>`<span class="badge${fresh.includes(t.id)?' new':''}" title="${t.desc}">${fresh.includes(t.id)?'ใหม่! ':''}${t.name}</span>`).join('')
    +(fresh.includes(main.id)?'<span class="badge new">ปลดล็อกฉายาใหม่!</span>':'');
  $('#resultOv').classList.add('show'); chime();
}
function openGallery(){
  const gal=store.get('tokyo.gallery',[]), un=new Set(store.get('tokyo.titles',[]));
  $('#galSub').textContent=`ทำไปแล้ว ${gal.length} แผ่น · คะแนนสูงสุด ${store.get('tokyo.best',0)} · ฉายาที่ปลดล็อก ${TITLES.filter(t=>un.has(t.id)).length}/${TITLES.length}`;
  $('#galTitles').innerHTML=TITLES.map(t=>un.has(t.id)?`<span class="badge" title="${t.desc}">${t.name}</span>`:`<span class="badge lock" title="ยังไม่ปลดล็อก">???</span>`).join('');
  const grid=$('#galGrid');
  grid.innerHTML=gal.length?'':'<div class="empty">ยังไม่มีขนมในแกลเลอรี ลองทำสักแผ่นสิ!</div>';
  gal.forEach(g=>{const d=document.createElement('div');d.className='gcard';const im=document.createElement('img');im.src=g.img;im.alt=g.title;
    const info=document.createElement('div');info.innerHTML=`<b></b><small></small>`;info.querySelector('b').textContent=g.title;
    info.querySelector('small').textContent=`${g.total} คะแนน · ${new Date(g.date).toLocaleDateString('th-TH',{day:'numeric',month:'short'})}`;d.append(im,info);grid.append(d)});
  $('#galOv').classList.add('show');
}
$('#galBtn').onclick=openGallery; $('#titleGal').onclick=openGallery; $('#resGal').onclick=openGallery;
$('#galClose').onclick=()=>{$('#galOv').classList.remove('show')};
$('#galOv').addEventListener('click',e=>{if(e.target.id==='galOv')$('#galOv').classList.remove('show')});

function titleStat(){const un=store.get('tokyo.titles',[]);$('#titleStat').textContent=`คะแนนสูงสุด ${store.get('tokyo.best',0)} · ฉายา ${un.length}/${TITLES.length}`}

/* demo pancake behind title screen */
function makeDemo(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x;if(!inG[i])continue;const dx=x+0.5-N/2,dy=y+0.5-N/2,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx);
    const R=66+2.5*Math.sin(5*a)+3*lace[i]; butter[i]=d<90?0.7:0;
    if(d<R){batter[i]=0.22+0.1*lace[i]+(d>R-3?-0.12:0);cook[i]=0.95+0.4*(spot[i]-0.5)+(d>R-5?0.5:0)}}
  S.hasBatter=true; renderBatter(); S.buDirty=true;
  S.actions=[{type:'sausage',kind:'piece',items:[makePiece('sausage',470,500),makePiece('sausage',535,500)]}];
  S.actions[0].items.forEach(p=>p.rot=0.05);
  const pork={type:'pork',kind:'crumb',items:[]}; for(let i=0;i<90;i++) pork.items.push(makeScatter('pork',500,500,95)); S.actions.push(pork);
  S.actions.push({type:'chili',kind:'cream',items:[{pts:[440,380,470,420,520,400,560,440,520,500,470,560,530,620,560,600]}]});
  redrawFillLayer();
}

buildSteps(); renderMute(); titleStat();
const ro=new ResizeObserver(()=>resize()); ro.observe($('#stage')); resize();
makeDemo(); renderPanel();
requestAnimationFrame(frame);
})();
</script>
